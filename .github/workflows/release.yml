name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer to release (for example, 0.1.0)
        required: true
        type: string

permissions: {}

jobs:
  release:
    permissions:
      actions: read
      checks: read
      contents: write
      pull-requests: write
      statuses: read
    # Follow eightctl: freeze, build, sign, independently verify, then publish.
    uses: openclaw/release-workflows/.github/workflows/release-go-cli.yml@f613cbfed2b043159c850c353e7facb8c89833b0 # v1 (1.9.0)
    with:
      version: ${{ inputs.version }}
      repository-type: personal
      require-signed-tag: true
      strict-checks: true
      ci-check-events: '["push", "pull_request"]'
      darwin-universal: disabled
      nfpm: disabled
      archive-files: '["README.md", "LICENSE"]'
      checksum-filename: checksums.txt
    secrets:
      MACOS_SIGNING_P12: ${{ secrets.MACOS_SIGNING_P12 }}
      MACOS_SIGNING_P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY_P8: ${{ secrets.ASC_PRIVATE_KEY_P8 }}
