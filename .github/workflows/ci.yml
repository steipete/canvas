name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Test
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.3
          cache: true
      - name: gofmt (check)
        run: |
          test -z "$(gofmt -l .)"
      - name: go mod tidy (check)
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: go test
        run: |
          go test ./...
      - name: go test -race
        run: |
          go test -race ./...
      - name: Browser integration tests
        run: go test -race -tags=integration ./internal/browser

      - name: Verify macOS 13 release compatibility
        run: |
          arch -x86_64 /usr/bin/true || sudo softwareupdate --install-rosetta --agree-to-license
          arch -x86_64 /usr/bin/true
          for target in amd64 arm64; do
            binary="$RUNNER_TEMP/canvas-$target"
            GOTOOLCHAIN=go1.27.3 CGO_ENABLED=0 GOARCH="$target" go build -o "$binary" ./cmd/canvas
            minos=$(otool -l "$binary" | awk '/LC_BUILD_VERSION/ { load = 1 } load && /minos/ { print $2; load = 0 }')
            test "$minos" = 13.0
            if [ "$target" = amd64 ]; then
              arch -x86_64 "$binary" --version
            else
              "$binary" --version
            fi
          done

  lint:
    name: Lint
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.3
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          install-mode: goinstall
          args: --timeout=5m

  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.3
          cache: true
      - name: Test
        run: go test -race ./...
      - name: Browser integration tests
        env:
          CANVAS_DEBUG: "1"
        # The runner's Google Chrome has a supported AppArmor sandbox profile.
        # Keep Chromium's sandbox enabled instead of adding --no-sandbox.
        run: |
          command -v google-chrome
          # The disposable test profile has no credentials. Avoid waiting for a
          # desktop Secret Service/keyring in the headless runner session.
          export CANVAS_TEST_BROWSER_BIN="$RUNNER_TEMP/canvas-test-chrome"
          cat > "$CANVAS_TEST_BROWSER_BIN" <<'SH'
          #!/bin/sh
          exec google-chrome --password-store=basic "$@"
          SH
          chmod +x "$CANVAS_TEST_BROWSER_BIN"
          dbus-run-session -- go test -race -tags=integration ./internal/browser
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          install-mode: goinstall
          args: --timeout=5m
